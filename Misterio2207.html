
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Misterio 2207</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body, #canvas {
            margin: 0;
            padding: 0;
            border: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            color: white;
            background-color: #000000;
            overflow: hidden;
            touch-action: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        #canvas {
            display: block;
        }

        #canvas:focus {
            outline: none;
        }

        /* Pantalla de carga personalizada */

        #status {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 24px;
            visibility: hidden;
            text-align: center;
        }

        #loading-title {
            color: #ffffff;
            font-size: clamp(30px, 6vw, 58px);
            font-weight: 800;
            letter-spacing: 5px;
            margin: 0 0 12px 0;
        }

        /* Barra de progreso roja */

        #status-progress {
            display: none;
            width: min(420px, 80vw);
            height: 10px;
            appearance: none;
            -webkit-appearance: none;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            background: #292929;
        }

        #status-progress::-webkit-progress-bar {
            background: #292929;
            border-radius: 20px;
        }

        #status-progress::-webkit-progress-value {
            background: #dc2626;
            border-radius: 20px;
        }

        #status-progress::-moz-progress-bar {
            background: #dc2626;
            border-radius: 20px;
        }

        #loading-text {
            color: #b8b8b8;
            font-size: 13px;
            margin: 0;
        }

        #status-notice {
            display: none;
            background-color: #5b2020;
            border: 1px solid #dc2626;
            border-radius: 8px;
            color: #ffffff;
            line-height: 1.4;
            max-width: 600px;
            padding: 16px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <canvas id="canvas">
        Tu navegador no admite el elemento canvas.
    </canvas>

    <noscript>
        Tu navegador necesita JavaScript para ejecutar Misterio 2207.
    </noscript>

    <div id="status">
        <h1 id="loading-title">MISTERIO 2207</h1>

        <progress id="status-progress"></progress>

        <p id="loading-text">Cargando juego...</p>

        <div id="status-notice"></div>
    </div>

    <script src="Misterio2207.js"></script>

    <script>
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "emscriptenPoolSize": 8,
            "ensureCrossOriginIsolationHeaders": true,
            "executable": "Misterio2207",
            "experimentalVK": false,
            "fileSizes": {
                "Misterio2207.pck": 93456776,
                "Misterio2207.wasm": 37902138
            },
            "focusCanvas": true,
            "gdextensionLibs": [],
            "godotPoolSize": 4
        };

        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);

        (function () {
            const statusOverlay = document.getElementById("status");
            const statusProgress = document.getElementById("status-progress");
            const statusNotice = document.getElementById("status-notice");
            const loadingText = document.getElementById("loading-text");

            let initializing = true;
            let statusMode = "";

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }

                if (mode === "hidden") {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }

                statusOverlay.style.visibility = "visible";

                statusProgress.style.display =
                    mode === "progress" ? "block" : "none";

                statusNotice.style.display =
                    mode === "notice" ? "block" : "none";

                loadingText.style.display =
                    mode === "progress" ? "block" : "none";

                statusMode = mode;
            }

            function setStatusNotice(message) {
                statusNotice.textContent = message;
            }

            function displayFailureNotice(err) {
                console.error(err);

                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === "string") {
                    setStatusNotice(err);
                } else {
                    setStatusNotice("Ha ocurrido un error desconocido.");
                }

                setStatusMode("notice");
                initializing = false;
            }

            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED
            });

            if (missing.length !== 0) {
                if (
                    GODOT_CONFIG["serviceWorker"] &&
                    GODOT_CONFIG["ensureCrossOriginIsolationHeaders"] &&
                    "serviceWorker" in navigator
                ) {
                    let serviceWorkerRegistrationPromise;

                    try {
                        serviceWorkerRegistrationPromise =
                            navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise = Promise.reject(
                            new Error("No se pudo registrar el Service Worker.")
                        );
                    }

                    Promise.race([
                        serviceWorkerRegistrationPromise
                            .then((registration) => {
                                if (registration != null) {
                                    return Promise.reject(
                                        new Error("Ya existe un Service Worker.")
                                    );
                                }

                                return engine.installServiceWorker();
                            }),
                        new Promise((resolve) => {
                            setTimeout(resolve, 2000);
                        })
                    ])
                    .then(() => {
                        window.location.reload();
                    })
                    .catch((err) => {
                        console.error(
                            "Error al registrar el Service Worker:",
                            err
                        );
                    });
                } else {
                    const missingMsg =
                        "Error\nEl navegador no admite las siguientes " +
                        "funciones necesarias para ejecutar el juego:\n";

                    displayFailureNotice(
                        missingMsg + missing.join("\n")
                    );
                }
            } else {
                setStatusMode("progress");

                engine.startGame({
                    onProgress: function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;

                            const percentage = Math.round(
                                (current / total) * 100
                            );

                            loadingText.textContent =
                                "Cargando juego... " + percentage + "%";
                        } else {
                            statusProgress.removeAttribute("value");
                            statusProgress.removeAttribute("max");

                            loadingText.textContent = "Cargando juego...";
                        }
                    }
                }).then(
                    () => {
                        setStatusMode("hidden");
                    },
                    displayFailureNotice
                );
            }
        }());
    </script>
</body>
</html>
